[project]
name = "mcp-server-semanticscholar"
version = "0.1.0"
description = "An MCP server for searching and retrieving articles from Semantic Scholar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.4.1",
    "semanticscholar>=0.4.0",
    "asyncio>=3.4.3",
    "requests>=2.25.0",
    "click>=8.1.8"
]

[project.scripts]
semanticscholar-mcp = "semantic_scholar_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["semantic_scholar_server", "semantic_scholar_search", "semantic_scholar_cli"] 